<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CanberraAI Chat</title>
<style>
:root{color-scheme:dark;--bg:#0c1220;--panel:#151f32;--line:#293750;--accent:#54c6a5;--muted:#9eabc0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#edf3fb;font:15px system-ui,sans-serif}main{max-width:900px;margin:32px auto;padding:0 16px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.logo{width:42px;height:42px;border-radius:12px;background:var(--accent);color:#06271e;display:grid;place-items:center;font-weight:900;font-size:20px}h1{font-size:22px;margin:0}small,.muted,.note{color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin:16px 0}h2{font-size:17px;margin:0 0 14px}textarea,input{width:100%;background:#0b1423;border:1px solid var(--line);border-radius:10px;color:#fff;padding:12px;font:inherit}textarea{min-height:150px;resize:vertical}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}button{background:var(--accent);border:0;color:#06271e;font-weight:700;padding:10px 15px;border-radius:9px;cursor:pointer}button.secondary{background:#26364f;color:#edf3fb}.status{font-size:13px;color:var(--muted);margin-left:auto;align-self:center}.file{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding:12px 0}.file span{flex:1;overflow-wrap:anywhere}.hidden{display:none}.note{font-size:13px;line-height:1.5}#login{max-width:500px;margin:10vh auto}
</style></head><body><main>
<div class="brand"><div class="logo">C</div><div><h1>CanberraAI Chat</h1><small>Private clipboard & file bridge</small></div><div id="status" class="status">Disconnected</div></div>
<section id="login" class="panel"><h2>Connect to your server</h2><p class="note">Enter the access token created during installation.</p><input id="token" type="password" placeholder="Access token" autocomplete="current-password"><div class="row"><button id="connect">Connect</button></div></section>
<div id="app" class="hidden">
<section class="panel"><h2>Clipboard</h2><textarea id="clip" placeholder="Type or paste text here. Send it to your connected devices."></textarea><div class="row"><button id="send">Send clipboard</button><button class="secondary" id="copy">Copy text</button><button class="secondary" id="paste">Paste from this device</button><span class="status" id="clipStatus"></span></div><p class="note">Browser clipboard access depends on permissions and HTTPS. You can also paste into this box and use Copy text.</p></section>
<section class="panel"><h2>Files</h2><input id="upload" type="file"><div class="row"><button id="uploadBtn">Upload file</button><span class="status" id="fileStatus"></span></div><div id="files"></div></section>
</div></main>
<script>
let token="",socket=null;const $=id=>document.getElementById(id);const headers=()=>({Authorization:"Bearer "+token});
function connect(){token=$("token").value.trim();if(!token)return;localStorage.setItem("cbridge_token",token);$("login").classList.add("hidden");$("app").classList.remove("hidden");const proto=location.protocol==="https:"?"wss:":"ws:";socket=new WebSocket(proto+"//"+location.host+"/ws");socket.onopen=()=>{socket.send(JSON.stringify({token}));$("status").textContent="Connected"};socket.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==="clipboard"){$("clip").value=m.text||"";$("clipStatus").textContent="Received from "+(m.source||"device")}};socket.onclose=()=>{$("status").textContent="Disconnected"};socket.onerror=()=>{$("status").textContent="Connection error"};loadFiles()}
$("connect").onclick=connect;
$("send").onclick=()=>{if(socket&&socket.readyState===1){socket.send(JSON.stringify({type:"clipboard",text:$("clip").value,source:"browser"}));$("clipStatus").textContent="Sent"}};
$("copy").onclick=async()=>{try{await navigator.clipboard.writeText($("clip").value);$("clipStatus").textContent="Copied"}catch(e){$("clip").select();document.execCommand("copy");$("clipStatus").textContent="Copy selected text manually"}};
$("paste").onclick=async()=>{try{$("clip").value=await navigator.clipboard.readText()}catch(e){$("clipStatus").textContent="Allow clipboard permission or paste manually"}};
async function loadFiles(){try{const r=await fetch("/api/files",{headers:headers()});if(!r.ok)throw Error();const d=await r.json();$("files").replaceChildren();d.files.forEach(f=>{const row=document.createElement("div");row.className="file";const label=document.createElement("span");label.textContent=f.name+" ("+(f.size/1024).toFixed(1)+" KB)";const dl=document.createElement("button");dl.className="secondary";dl.textContent="Download";dl.onclick=async()=>{const res=await fetch("/api/files/"+encodeURIComponent(f.name),{headers:headers()});if(!res.ok)return;const url=URL.createObjectURL(await res.blob());const a=document.createElement("a");a.href=url;a.download=f.name;a.click();URL.revokeObjectURL(url)};const del=document.createElement("button");del.className="secondary";del.textContent="Delete";del.onclick=async()=>{if(confirm("Delete "+f.name+"?")){await fetch("/api/files/"+encodeURIComponent(f.name),{method:"DELETE",headers:headers()});loadFiles()}};row.append(label,dl,del);$("files").append(row)})}catch(e){$("fileStatus").textContent="Could not load files"}}
$("uploadBtn").onclick=async()=>{const f=$("upload").files[0];if(!f)return;$("fileStatus").textContent="Uploading…";const fd=new FormData();fd.append("file",f);const r=await fetch("/api/files",{method:"POST",headers:headers(),body:fd});$("fileStatus").textContent=r.ok?"Uploaded":"Upload failed";if(r.ok){$("upload").value="";loadFiles()}};
const saved=localStorage.getItem("cbridge_token");if(saved){$("token").value=saved;connect()}
</script></body></html>
